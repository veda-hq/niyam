name: guard

# The Guard check (#304): a change to niyam's checks, hooks or their scripts
# passes only when the pull request's slice names it in a **Guards:** section
# the owner approved. pull_request_target, so GitHub runs this file and
# scripts/guard.mjs from main's copy, never the pull request's: it checks out
# main alone, and reads the pull request's files from the API as data. It
# never checks out or runs the pull request's code, which is what keeps the
# base repository's token here safe.
on:
  pull_request_target:
    # edited: a changed "Slice: #N" line, or the title an exemption reads, is judged again.
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      # main's lockfile, for the yaml parser that reads workflow job names. No
      # install scripts run: the guard needs the package alone.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Only the pull request's number reaches the script; it reads the rest from the API.
      - run: node scripts/guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
