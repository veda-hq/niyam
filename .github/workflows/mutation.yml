name: Mutation

# niyam's mutation gate on pull requests (Work item #580, slice #581), after
# veda's mutation.yml: a Lane job per agnipariksha lane (agnipariksha.json),
# each running the agnipariksha package.json pins with `--lane`, so it judges
# the lane's changed files whole, and a Mutation job over both. A lane with no
# changed file judges nothing and passes, so the lanes are listed, not
# planned.
#
# A surviving or uncovered mutant in a changed file (exit 1) fails its lane,
# as a refusal (exit 2: a bad config, a failed dry run) does (#706). Each
# lane is named, so agnipariksha.json's maxLines cut-off never leaves one out
# here: this is where a change the pre-push hook left to CI is judged.
#
# No `paths:` filter, so the check reports on every pull request, and no
# `workflow_dispatch`, whose run would post the gate as skipped on the pull
# request's head (pariksha's dispatch-on-gate-workflow). No secrets and a
# read-only token: a mutant that reaches git or gh has no credentials.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    # A fixed name: GitHub appends each leg's matrix value, as "Lane (src)".
    # Guard refuses a job name holding an expression.
    name: Lane
    runs-on: ubuntu-latest
    # A lane's files are mutated whole, and agnipariksha's timeout retries may
    # take 15 minutes more.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [src, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Some suites run the built CLI from dist/.
      - run: pnpm build
      - name: agnipariksha
        env:
          LANE: ${{ matrix.lane }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          status=0
          node_modules/.bin/agnipariksha --lane "$LANE" --base "origin/$BASE_REF" --tracked-only --no-reuse || status=$?
          case "$status" in
            0) ;;
            1) echo "::error title=Mutation ($LANE)::a mutant no test kills is left in a changed file"; exit 1 ;;
            *) echo "::error title=Mutation ($LANE)::agnipariksha refused or could not judge (exit $status)"; exit "$status" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: mutation-${{ matrix.lane }}
          path: reports/agnipariksha
          if-no-files-found: ignore

  # Passes when every lane job passed.
  gate:
    name: Mutation
    needs: [lane]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          LANES: ${{ needs.lane.result }}
        run: |
          set -euo pipefail
          echo "lane jobs: $LANES"
          if [ "$LANES" != success ]; then
            echo "::error::the lane jobs did not all pass ($LANES)"
            exit 1
          fi
