name: Release

# A release is the merge of its version bump (P-61): a push to main whose
# package.json version has no tag vX.Y.Z yet. This workflow then runs pnpm
# check, makes the tag itself on that commit, publishes the CLI package to npm
# and makes the GitHub release with the package attached. Clients pin the
# tag: their workflow calls checks.yml at it, and machines install the
# attached package, built and tested here, so nothing is built on install.
# The same package goes to npm as @veda-hq/niyam, signed with provenance from
# this workflow, so a repository can pin it as an exact registry version (P-59).
# Nobody pushes a release tag by hand: `niyam upgrade` and `niyam onboard` ask
# GitHub whether a tag's commit is on main, and refuse one that is not.
#
# npm auth: trusted publishing (OIDC) only, set up on npmjs.com for
# @veda-hq/niyam with this repository, this workflow and the `npm`
# environment, which only main may deploy to. There is no npm token, so a
# leaked secret cannot publish. Keep this file's name and the environment's.
on:
  push:
    branches: [main]

permissions: {}

# One release run at a time, never cancelled half way: each step below skips
# what an earlier run did, so a re-run finishes a release that stopped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Is this a version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A version whose tag is on another commit was released before: nothing
      # to do. No tag, or the tag on this very commit (a run that stopped after
      # making it), is a release to make or finish.
      - name: The version, when its tag is missing or on this commit
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::package.json version $version is not X.Y.Z"; exit 1; }
          refs=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}")
          # An annotated tag's commit is its peeled ^{} line; a lightweight one's is its own.
          commit=$(awk -v peeled="refs/tags/v$version^{}" '$2 == peeled { print $1 }' <<<"$refs")
          [ -n "$commit" ] || commit=$(awk '{ print $1; exit }' <<<"$refs")
          if [ -z "$commit" ]; then
            echo "v$version has no tag yet: releasing it from $GITHUB_SHA"
          elif [ "$commit" = "$GITHUB_SHA" ]; then
            echo "v$version is tagged on this commit already: finishing its release"
          else
            echo "v$version is tagged on $commit, released before: nothing to do"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # pnpm check builds dist/ and tests it; the package attached below is that build.
      - run: pnpm check
      - name: Pack the CLI
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      # An annotated tag, made through the API as github-actions[bot], so no
      # git credential is kept. A tag that is here already must be on this commit.
      - name: Tag this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          commit=$(awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }' <<<"$refs")
          [ -n "$commit" ] || commit=$(awk '{ print $1; exit }' <<<"$refs")
          if [ "$commit" = "$GITHUB_SHA" ]; then
            echo "$TAG is on $GITHUB_SHA already"
            exit 0
          fi
          [ -z "$commit" ] || { echo "::error::$TAG is on $commit, not $GITHUB_SHA"; exit 1; }
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="niyam $VERSION" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          echo "tagged $GITHUB_SHA $TAG"
      # A version on npm already is skipped, so a rerun is safe.
      - name: Publish the CLI package to npm
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is on npm already: skipped"
            exit 0
          fi
          npm publish "$RUNNER_TEMP/veda-hq-niyam-$VERSION.tgz" --access public --provenance
      # Since P-57 the release attaches the CLI package alone: the bridge
      # archive under the name before niyam is gone (docs/decisions.md).
      - name: Publish the release, with the CLI package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "the $TAG release is published already: skipped"
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/veda-hq-niyam-$VERSION.tgz" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "niyam $TAG"
