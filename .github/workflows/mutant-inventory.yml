name: Mutant inventory

# Slice #602 (Work item #580): take stock of every surviving mutant in niyam
# before the one-time sweep, after veda's inventory (veda-hq/veda#360). It
# lives only on its draft pull request, closed unmerged once the inventory is
# posted on #580, and never merges.
#
# One job per source file of each lane in agnipariksha.json runs the pinned
# `agnipariksha --lane <lane> --files <file> --no-reuse`, so one refusal loses
# one file, not a lane. A Tally job adds the records up. Jobs fail only on a
# fault in the measurement: a refusal, a missing record, or a control that
# does not hold. Survivors are the result, never a failure.
#
# No secrets and a read-only token: a mutant that reaches git or gh has no
# credentials.

on:
  pull_request:
    paths:
      - .github/workflows/mutant-inventory.yml
      - .github/mutant-inventory/**

permissions:
  contents: read

concurrency:
  group: mutant-inventory-${{ github.ref }}
  cancel-in-progress: true

env:
  # smoke: the control file alone, to read its cost. full: every lane file.
  SCOPE: smoke

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      judged: ${{ steps.plan.outputs.judged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: |
          set -euo pipefail
          mkdir -p inventory
          node .github/mutant-inventory/plan.mjs "$SCOPE" > inventory/plan.json
          echo "judged=$(jq -c .judged inventory/plan.json)" >> "$GITHUB_OUTPUT"
          cat inventory/plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-plan
          path: inventory/plan.json
          retention-days: 90

  measure:
    # A fixed name: GitHub appends each leg's matrix values.
    name: Measure
    needs: [plan]
    runs-on: ubuntu-latest
    # onboard.ts is 2,218 lines; veda measured up to 0.89 s a line.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Leaves the org's other pull requests runners.
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.judged) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Some suites run the built CLI from dist/.
      - run: pnpm build
      - name: agnipariksha
        env:
          LANE: ${{ matrix.lane }}
          FILE: ${{ matrix.file }}
          ID: ${{ matrix.id }}
        run: node .github/mutant-inventory/measure.mjs "$LANE" "$FILE" "$ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: inventory-${{ matrix.id }}
          path: |
            inventory/
            reports/agnipariksha/*.json
          if-no-files-found: ignore
          retention-days: 90

  tally:
    name: Tally
    needs: [plan, measure]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: inventory-*
          path: downloaded
      - env:
          SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p inventory
          cp downloaded/inventory-plan/plan.json inventory/plan.json
          find downloaded -path '*/inventory/*.json' -name '*.json' ! -name plan.json -exec cp {} inventory/ \;
          node .github/mutant-inventory/tally.mjs inventory/plan.json inventory "$SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: inventory-tally
          path: |
            inventory/inventory.md
            inventory/inventory.json
          retention-days: 90
